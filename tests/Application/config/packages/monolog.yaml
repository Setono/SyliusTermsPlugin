when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            firephp:
                type: firephp
                level: info

when@test: &test
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: error
            # Keeps the errors in memory, so tests can assert on them (monolog.handler.test)
            test:
                type: test
                level: error

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

# The test environment with the Terms PDFs switched off, see setono_sylius_terms.yaml
when@test_pdf_off: *test
