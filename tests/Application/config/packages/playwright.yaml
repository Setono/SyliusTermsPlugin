when@test: &test
    playwright:
        assets:
            # The bundle's defaults plus /bundles, where assets:install puts the plugin's public/ files, /images, which
            # holds the image in the baseline Terms' content, and /media/terms, where the plugin stores Uploaded images
            prefixes: ['/assets', '/build', '/_framework/ux', '/bundles', '/images', '/media/terms']

# The test environment with the Terms PDFs switched off, see setono_sylius_terms.yaml
when@test_pdf_off: *test
